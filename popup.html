<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tab Suspender</title>
<style>
  :root {
    --bg: #1f2023;
    --card: #2a2b2e;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #4285f4;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  body {
    width: 300px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
  }
  .section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row:last-child { margin-bottom: 0; }
  .title { font-weight: 600; font-size: 14px; }
  .muted { color: var(--muted); font-size: 12px; }
  select, button {
    font: inherit;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  button { cursor: pointer; }
  button:hover { background: #35363a; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    width: 100%;
  }
  button.primary:hover { background: #5a95f5; }
  .switch {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #555; border-radius: 20px; cursor: pointer; transition: 0.15s;
  }
  .slider::before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px;
    background: white; border-radius: 50%; transition: 0.15s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(16px); }
  .domain-name {
    font-weight: 600;
    max-width: 170px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .footer-link {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .footer-link:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="section">
    <div class="row">
      <span class="title">Auto-suspend</span>
      <label class="switch">
        <input type="checkbox" id="autoSuspendToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="muted" id="suspendedCount" style="cursor:pointer; text-decoration:underline; text-decoration-style:dotted;">0 tabs suspended</span>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <span class="domain-name" id="currentDomain">this site</span>
    </div>
    <div class="row">
      <span class="muted">Suspend after</span>
      <select id="domainTimeoutSelect">
        <option value="0">Never</option>
        <option value="5">5 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">1 hour</option>
        <option value="180">3 hours</option>
        <option value="default">Default</option>
      </select>
    </div>
  </div>

  <div class="section">
    <button class="primary" id="suspendAllBtn">Suspend all other tabs</button>
  </div>

  <div class="footer-link" id="openOptions">More settings & whitelist →</div>

  <script src="popup.js"></script>
</body>
</html>
