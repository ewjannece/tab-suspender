<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tab Suspender</title>
<style>
  :root {
    --bg: #1f2023;
    --card: #2a2b2e;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #4285f4;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  body {
    width: 300px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
  }
  .section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .section:last-child { border-bottom: none; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row:last-child { margin-bottom: 0; }
  .field-label { font-size: 13px; }
  select, input[type=number], button {
    font: inherit;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  input[type=number] { width: 70px; }
  button { cursor: pointer; }
  button:hover { background: #35363a; }
  button:disabled { opacity: 0.5; cursor: default; }
  #whitelistSiteName {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 8px;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    width: 100%;
  }
  button.primary:hover { background: #5a95f5; }
  .switch {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #555; border-radius: 20px; cursor: pointer; transition: 0.15s;
  }
  .slider::before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px;
    background: white; border-radius: 50%; transition: 0.15s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(16px); }
  input:disabled + .slider { opacity: 0.5; cursor: default; }
  .footer-link {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .footer-link:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="section">
    <button class="primary" id="viewSuspendedBtn">View suspended tabs</button>
  </div>

  <div class="section" id="whitelistSection">
    <div class="row">
      <label class="field-label" for="whitelistToggle" id="whitelistSiteName">Whitelist domain</label>
      <label class="switch">
        <input type="checkbox" id="whitelistToggle" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <label class="field-label" for="defaultTimeout">Default timeout (minutes)</label>
      <input type="number" id="defaultTimeout" min="1" max="1440" />
    </div>
    <div class="row">
      <label class="field-label" for="suspendAudible">Suspend tabs playing audio or video</label>
      <label class="switch">
        <input type="checkbox" id="suspendAudible" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label class="field-label" for="suspendPinned">Suspend pinned tabs</label>
      <label class="switch">
        <input type="checkbox" id="suspendPinned" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label class="field-label" for="restoreOnActivate">Restore suspended tabs when clicked</label>
      <label class="switch">
        <input type="checkbox" id="restoreOnActivate" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer-link" id="openOptions">More settings & whitelist →</div>

  <script src="popup.js"></script>
</body>
</html>
